<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Video call</title>
<style>
  html, body { margin:0; height:100%; background:#101828; color:#fff; font-family:system-ui, -apple-system, sans-serif; overflow:hidden; }
  #remote { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:#000; display:none; }
  #local { position:fixed; right:14px; top:max(14px, env(safe-area-inset-top)); width:28vw; max-width:160px; aspect-ratio:3/4; object-fit:cover;
    border-radius:16px; border:3px solid #fff; transform:scaleX(-1); display:none; background:#000; }
  #panel { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; text-align:center; }
  h1 { margin:0; font-size:28px; }
  #msg { margin:0; font-size:18px; opacity:.85; min-height:1.4em; }
  button { font:inherit; border:0; border-radius:999px; cursor:pointer; }
  #join { font-size:22px; font-weight:700; padding:18px 44px; background:#3ecf5a; color:#0b2a12; }
  #hang { position:fixed; left:50%; bottom:max(28px, env(safe-area-inset-bottom)); transform:translateX(-50%); display:none;
    font-size:18px; font-weight:700; padding:16px 38px; background:#ff4d4d; color:#fff; }
  body.live #remote, body.live #local, body.live #hang { display:block; }
  body.live #panel { display:none; }
</style>
</head>
<body>
<video id="remote" playsinline autoplay></video>
<video id="local" playsinline autoplay muted></video>
<div id="panel">
  <h1>Video call</h1>
  <p id="msg">Tap to join with your camera and microphone.</p>
  <button id="join">Join call</button>
</div>
<button id="hang">End call</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
// The call id comes after the # in the link. Video and sound go straight between the two devices (WebRTC).
const room = location.hash.slice(1).replace(/[^a-zA-Z0-9]/g, '');
const $ = id => document.getElementById(id);
let peer, call, stream, live = false, tries = 0, over = false;
const say = t => { $('msg').textContent = t; };

function end(text) {
  if (over) return; over = true;
  try { call && call.close(); } catch {}
  try { peer && peer.destroy(); } catch {}
  if (stream) stream.getTracks().forEach(t => t.stop());
  document.body.classList.remove('live');
  $('join').style.display = 'none';
  say(text || 'Call ended.');
}
function dial() {
  if (over || live) return;
  tries++;
  call = peer.call('cp-' + room, stream);
  call.on('stream', remote => {
    live = true; $('remote').srcObject = remote; document.body.classList.add('live');
    const pc = call.peerConnection;
    pc.addEventListener('iceconnectionstatechange', () => {
      if (['failed', 'closed'].includes(pc.iceConnectionState)) end('Call ended.');
      if (pc.iceConnectionState === 'disconnected') setTimeout(() => { if (pc.iceConnectionState === 'disconnected') end('Call ended.'); }, 6000);
    });
  });
  call.on('close', () => { if (live) end('Call ended.'); });
}
$('join').onclick = async () => {
  if (!room) return say('This link has no call in it.');
  $('join').disabled = true; say('Starting your camera…');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
  } catch (err) { $('join').disabled = false; return say('Camera or microphone was blocked. Allow them and tap again.'); }
  $('local').srcObject = stream; say('Connecting…');
  peer = new Peer();
  peer.on('open', dial);
  peer.on('error', err => {
    if (err.type === 'peer-unavailable' && !live) {          // her phone is not ready yet: keep trying for about a minute
      if (tries < 30) { say('Ringing…'); setTimeout(dial, 2000); } else end('No answer. The call link has expired.');
    } else if (!live) end('Could not connect (' + err.type + ').');
  });
};
$('hang').onclick = () => end('Call ended.');
if (!room) say('This link has no call in it.');
</script>
</body>
</html>
